version: "3.9"

services:

  redis:
    image: redis:7-alpine
    container_name: sd_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: >
      redis-server
      --maxmemory ${REDIS_MAXMEMORY:-256mb}
      --maxmemory-policy ${REDIS_EVICTION_POLICY:-allkeys-lru}
      --notify-keyspace-events Ex
    volumes:
      - redis_data:/data
    networks:
      - sd_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  metrics_store:
    build:
      context: ./metrics_store
    container_name: sd_metrics
    restart: unless-stopped
    ports:
      - "8003:8003"
    volumes:
      - ./results:/app/results
    networks:
      - sd_net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  response_generator:
    build:
      context: ./response_generator
    container_name: sd_response_generator
    restart: unless-stopped
    ports:
      - "8002:8002"
    environment:
      - METRICS_URL=http://metrics_store:8003
      - DATA_PATH=/app/data/buildings.csv
      # LATENCY_FACTOR_MS: ms de latencia simulada por cada 10k registros procesados.
      # Default 5ms → miss tarda ~50-150ms según zona (cuello de botella visible).
      # E1/E2: usar default. E3/E4/E5: scripts lo sobreescriben a 80ms.
      # Con 0.5ms (valor anterior) el backend era tan rápido que no había backlog.
      - LATENCY_FACTOR_MS=${LATENCY_FACTOR_MS:-5}
    volumes:
      - ./data:/app/data:ro
    networks:
      - sd_net
    depends_on:
      metrics_store:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  cache_service:
    build:
      context: ./cache_service
    container_name: sd_cache
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RESPONSE_GENERATOR_URL=http://response_generator:8002
      - METRICS_URL=http://metrics_store:8003
      - TTL_Q1=${TTL_Q1:-120}
      - TTL_Q2=${TTL_Q2:-120}
      - TTL_Q3=${TTL_Q3:-90}
      - TTL_Q4=${TTL_Q4:-60}
      - TTL_Q5=${TTL_Q5:-30}
      - EVICTION_POLL_INTERVAL=${EVICTION_POLL_INTERVAL:-5}
    networks:
      - sd_net
    depends_on:
      redis:
        condition: service_healthy
      response_generator:
        condition: service_healthy
      metrics_store:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  traffic_generator:
    build:
      context: ./traffic_generator
    container_name: sd_traffic
    restart: "no"
    environment:
      - MODE=${MODE:-sync}
      - CACHE_URL=http://cache_service:8001
      - KAFKA_BOOTSTRAP=kafka:9092
      - TOPIC_MAIN=queries
      - DISTRIBUTION=${TRAFFIC_DISTRIBUTION:-zipf}
      - NUM_REQUESTS=${NUM_REQUESTS:-5000}
      - ARRIVAL_RATE=${ARRIVAL_RATE:-20}
      - ZIPF_ALPHA=${ZIPF_ALPHA:-1.2}
      - CONF_VALUES=${CONF_VALUES:-0.0,0.7}
    networks:
      - sd_net
    depends_on:
      cache_service:
        condition: service_healthy

  # Zookeeper
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: sd_zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - sd_net
    healthcheck:
      test: ["CMD", "bash", "-c", "timeout 5 zookeeper-shell localhost:2181 ls / 2>/dev/null | grep -q zookeeper && exit 0 || exit 1"]
      interval: 10s
      timeout: 8s
      retries: 20
      start_period: 15s

  # Kafka
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: sd_kafka
    restart: on-failure
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_MS: 3600000
      KAFKA_LOG_RETENTION_BYTES: 536870912
      KAFKA_NUM_PARTITIONS: 4
      KAFKA_ZOOKEEPER_CONNECTION_TIMEOUT_MS: 60000
      KAFKA_ZOOKEEPER_SESSION_TIMEOUT_MS: 60000
    networks:
      - sd_net
    depends_on:
      zookeeper:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 15s
      retries: 20
      start_period: 30s


  kafka_consumer:
    build:
      context: ./kafka_consumer
    restart: unless-stopped
    environment:
      - KAFKA_BOOTSTRAP=kafka:9092
      - TOPIC_MAIN=queries
      - TOPIC_RETRY=queries.retry
      - TOPIC_RECOVERY=queries.recovery
      - TOPIC_DLQ=queries.dlq
      - GROUP_ID=sd-consumers
      - MAX_RETRIES=${MAX_RETRIES:-3}
      - CACHE_URL=http://cache_service:8001
      - METRICS_URL=http://metrics_store:8003
      - RETRY_DELAY_MS=${RETRY_DELAY_MS:-500}
    networks:
      - sd_net
    depends_on:
      kafka:
        condition: service_healthy
      cache_service:
        condition: service_healthy
      metrics_store:
        condition: service_healthy
    
volumes:
  redis_data:

networks:
  sd_net:
    driver: bridge
